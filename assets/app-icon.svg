<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Graphite Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161920" />
      <stop offset="100%" stop-color="#0b0d11" />
    </linearGradient>

    <!-- Cyan Laser Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Medallion -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#262c36" stroke-width="12" />

  <!-- Inner Cyan Accent Ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.35" />

  <!-- Glow halos under nodes -->
  <circle cx="150" cy="256" r="90" fill="url(#nodeGlow)" />
  <circle cx="362" cy="256" r="90" fill="url(#nodeGlow)" />

  <!-- Laser Bridge Line -->
  <line x1="150" y1="256" x2="362" y2="256" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 18" />

  <!-- Local Node: Windows PC -->
  <circle cx="150" cy="256" r="54" fill="#1e222b" stroke="#0ea5e9" stroke-width="6" />
  <!-- PC Screen Glyph -->
  <rect x="132" y="240" width="36" height="24" rx="3" fill="none" stroke="#f1f5f9" stroke-width="4" />
  <line x1="150" y1="264" x2="150" y2="272" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
  <line x1="140" y1="272" x2="160" y2="272" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />

  <!-- Remote Node: MacBook -->
  <circle cx="362" cy="256" r="54" fill="#1e222b" stroke="#0ea5e9" stroke-width="6" />
  <!-- Laptop Screen & Base Glyph -->
  <rect x="344" y="242" width="36" height="22" rx="2" fill="none" stroke="#f1f5f9" stroke-width="4" />
  <line x1="336" y1="268" x2="388" y2="268" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" />

  <!-- Central Cryptographic Shield / Pulse Core -->
  <circle cx="256" cy="256" r="28" fill="#0ea5e9" />
  <!-- Keyhole / Secure Symbol -->
  <circle cx="256" cy="251" r="6" fill="#0b0d11" />
  <polygon points="253,253 259,253 261,263 251,263" fill="#0b0d11" />
</svg>
